<!DOCTYPE html>
<html>
<head>
  <title>Edit Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .profile-card { max-width:430px; margin:2.5rem auto; box-shadow:0 2px 12px rgba(60,90,120,0.10); border-radius:10px; }
    .profile-card .card-header { background:#075aaa; color:#fff; }
    .form-label {font-weight:600;}
    .btn {min-width:100px;}
    .small-note { font-size:0.9rem; color:#888;}
  </style>
</head>
<body>
<!-- ====== NAVBAR HEADER ====== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-white" href="/dashboard">HIV Accomplishment Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/profile' %}active{% endif %}" href="/profile">Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/encode' %}active{% endif %}" href="/encode">Encode</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-warning" href="/logout">Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="profile-card card">
  <div class="card-header">
    <h5 class="mb-0">Edit My Profile</h5>
  </div>
  <div class="card-body">
    {% if message %}<div class="alert alert-info mb-2">{{ message }}</div>{% endif %}
    <form method="post">
      <div class="row g-2">
        <div class="col-12 mb-2">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" name="name" value="{{ profile.get('NAME','') }}" required>
        </div>
        <div class="col-12 mb-2">
         <div class="col-12 mb-2">
  <label class="form-label">Email</label>
  <input type="email" class="form-control" name="email" value="{{ profile.get('EMAIL','') }}" required readonly>
  <span class="small-note">Must match your login email.</span>
</div>

        <div class="col-6 mb-2">
          <label class="form-label">Facility</label>
          <input type="text" class="form-control" name="facility" value="{{ profile.get('FACILITY','') }}">
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Role</label>
          <input type="text" class="form-control" name="role" value="{{ profile.get('ROLE','') }}">
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Sex</label>
          <select class="form-select" name="sex" required>
            <option value="">Select</option>
            <option value="Male" {% if profile.get('Sex','')=='Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if profile.get('Sex','')=='Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if profile.get('Sex','')=='Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Birthdate</label>
          <input type="date" class="form-control" name="birthdate" value="{{ profile.get('Birthdate','') }}">
        </div>
        <div class="col-6 mb-2">
          <label class="form-label">Age</label>
          <input type="number" min="0" class="form-control" name="age" value="{{ profile.get('Age','') }}">
        </div>
        <div class="col-12 mb-2">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ profile.get('Address','') }}">
        </div>
        <div class="col-12 mb-2">
          <label class="form-label">Contact Number</label>
          <input type="text" class="form-control" name="contact_number" value="{{ profile.get('Contact Number','') }}">
        </div>
      </div>
      <div class="d-flex justify-content-between mt-3">
        <button type="submit" class="btn btn-success">Save</button>
        <a class="btn btn-outline-secondary" href="/dashboard">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
